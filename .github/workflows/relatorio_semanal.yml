# .github/workflows/relatorio_semanal.yml
# Dispara o relatório semanal automaticamente toda segunda-feira às 08:00 BRT (11:00 UTC)
#
# Pode também ser disparado manualmente via:
#   GitHub → Actions → "Relatório Semanal" → Run workflow
#
# Secrets necessários (Settings → Secrets → Actions):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   SMTP_HOST
#   SMTP_PORT
#   SMTP_USER
#   SMTP_PASSWORD
#   SMTP_FROM_NAME     (opcional)
#   SCHEDULER_TENANT_ID
#
# Variáveis opcionais:
#   SCHEDULER_REVISAO_ID   (se vazio, busca revisão ativa automaticamente)
#   SCHEDULER_DIAS_TRAV    (padrão: 2)
#   SCHEDULER_DIAS_UPD     (padrão: 5)

name: Relatório Semanal

on:
  schedule:
    # Toda segunda-feira às 11:00 UTC (08:00 BRT)
    - cron: "0 11 * * 1"

  # Disparo manual com opções
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não envia e-mails)"
        type: boolean
        default: false
      force:
        description: "Forçar envio mesmo fora da janela"
        type: boolean
        default: true
      revisao_id:
        description: "ID da revisão (vazio = busca ativa automaticamente)"
        type: string
        default: ""

env:
  PYTHON_VERSION: "3.11"

jobs:
  dispatch:
    name: Disparar relatório
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar scheduler
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST:                 ${{ secrets.SMTP_HOST }}
          SMTP_PORT:                 ${{ secrets.SMTP_PORT }}
          SMTP_USER:                 ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:             ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME:            ${{ secrets.SMTP_FROM_NAME }}
          SCHEDULER_TENANT_ID:       ${{ secrets.SCHEDULER_TENANT_ID }}
          SCHEDULER_REVISAO_ID:      ${{ github.event.inputs.revisao_id || '' }}
          SCHEDULER_DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SCHEDULER_FORCE:           ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python scheduler.py

      - name: Notificar falha
        if: failure()
        run: |
          echo "❌ Relatório semanal falhou. Verifique os logs acima."
          echo "Tenant: $SCHEDULER_TENANT_ID"
          echo "Horário: $(date -u '+%Y-%m-%d %H:%M UTC')"
