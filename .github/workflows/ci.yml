# .github/workflows/ci.yml
# Pipeline de CI — roda em todo push e PR para main/develop
#
# Jobs:
#   1. test     — pytest com cobertura (sem rede/Supabase)
#   2. lint     — ruff + mypy básico
#   3. health   — health check com skip_db=True (verifica estrutura sem banco)
#
# Secrets necessários no repositório (Settings → Secrets):
#   Nenhum para CI básico. Para health check completo com banco:
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY

name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Testes unitários
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências de teste
        run: |
          pip install pytest pytest-cov pandas

      - name: Executar testes
        run: |
          python -m pytest tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v
        env:
          # Stub para módulos que tentam importar streamlit
          PYTHONPATH: .

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Lint e formatação
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar formatação e estilo (ruff)
        run: |
          ruff check src/ tests/ \
            --select E,F,W,I \
            --ignore E501,E402,F401 \
            --output-format github

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Verificação de estrutura (sem banco)
  # ──────────────────────────────────────────────────────────────────────────
  structure-check:
    name: Verificação de estrutura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install pandas

      - name: Verificar imports dos módulos novos
        run: |
          python -c "
          import sys, types

          # Stub streamlit
          class _CR:
              def __call__(self, f=None, **kw): return f if f else (lambda fn: fn)
          st = types.ModuleType('streamlit')
          st.cache_resource = _CR()
          st.session_state = {}
          sys.modules['streamlit'] = st

          # Stub supabase
          sup = types.ModuleType('supabase')
          sup.Client = object
          sup.create_client = lambda *a, **kw: object()
          sys.modules['supabase'] = sup

          sys.path.insert(0, '.')

          # Verifica imports críticos
          from src.auth.rate_limit import get_rate_limit_key, check_rate_limit, record_failure, record_success
          from src.auth.audit import audit_log, audit_login_success, audit_login_failure
          from src.utils.observability import log_error, capture, safe_query, get_recent_errors
          from src.domain.kpi import calc_pct, calc_expected, build_group_kpi, calc_global_kpis

          print('✅ Todos os imports críticos OK')
          "
        env:
          PYTHONPATH: .

      - name: Verificar migration SQL existe
        run: |
          test -f migrations/001_create_audit_logs.sql && \
            echo "✅ Migration 001 existe" || \
            (echo "❌ Migration 001 não encontrada" && exit 1)

      - name: Verificar arquivos de teste existem
        run: |
          for f in tests/test_kpi.py tests/test_rate_limit.py tests/test_audit.py tests/test_observability.py; do
            test -f "$f" && echo "✅ $f" || (echo "❌ $f não encontrado" && exit 1)
          done
