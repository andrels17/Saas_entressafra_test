name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: .
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint e formato
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff

      - name: Verificar imports, estilo e erros reais
        run: |
          ruff check src tests \
            --select E,F,W,I \
            --ignore E501,E402,F401 \
            --output-format github

      - name: Verificar formatação
        run: |
          ruff format --check src tests

  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pandas pypdf

      - name: Executar testes
        run: |
          python -m pytest tests \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  structure-check:
    name: Verificação de estrutura
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências mínimas
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verificar imports críticos
        run: |
          python - <<'PY'
          import sys
          import types

          class _CR:
              def __call__(self, f=None, **kw):
                  return f if f else (lambda fn: fn)

          st = types.ModuleType("streamlit")
          st.cache_resource = _CR()
          st.cache_data = _CR()
          st.session_state = {}
          st.query_params = {}
          st.rerun = lambda: None

          def _stop():
              raise SystemExit("stop")
          st.stop = _stop

          sys.modules["streamlit"] = st

          sup = types.ModuleType("supabase")
          sup.Client = object
          sup.create_client = lambda *a, **kw: object()
          sys.modules["supabase"] = sup

          sys.path.insert(0, ".")

          from src.auth.rate_limit import (
              check_rate_limit,
              get_rate_limit_key,
              record_failure,
              record_success,
          )
          from src.auth.audit import (
              audit_log,
              audit_login_failure,
              audit_login_success,
          )
          from src.domain.kpi import (
              build_group_kpi,
              calc_expected,
              calc_global_kpis,
              calc_pct,
          )
          from src.utils.observability import (
              capture,
              get_recent_errors,
              log_error,
              safe_query,
          )

          print("✅ Todos os imports críticos OK")
          PY

      - name: Verificar migration SQL existe
        run: |
          test -f migrations/001_create_audit_logs.sql && \
            echo "✅ Migration 001 existe" || \
            (echo "❌ Migration 001 não encontrada" && exit 1)

      - name: Verificar arquivos de teste existem
        run: |
          for f in \
            tests/test_kpi.py \
            tests/test_rate_limit.py \
            tests/test_audit.py \
            tests/test_observability.py \
            tests/test_integration_auth_tenant.py
          do
            test -f "$f" && echo "✅ $f" || (echo "❌ $f não encontrado" && exit 1)
          done

  security:
    name: Segurança básica
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar ferramentas de segurança
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit
        run: |
          bandit -r src -q -x tests || true

      - name: Pip Audit
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          else
            echo "requirements.txt não encontrado, pulando pip-audit"
          fi
